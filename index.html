<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks | Hangr</title>
<style>
body{margin:0;background:#FAF8F4;color:#211D18;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:420px;padding:32px 24px;text-align:center}
h1{font-size:30px;margin:0 0 12px}
p{font-size:17px;line-height:1.45;color:#5b544b;margin:0 0 20px}
textarea{width:100%;box-sizing:border-box;min-height:110px;border:1px solid #E8E3DA;border-radius:16px;padding:14px;font:inherit;background:#fff;color:#211D18;resize:vertical}
button{margin-top:14px;width:100%;border:0;border-radius:999px;background:#211D18;color:#FAF8F4;font:inherit;font-weight:700;padding:15px;cursor:pointer}
button:disabled{opacity:.5}
</style></head><body><main>
<h1>Thank you!</h1>
<p id="msg">Got it. Want to tell me more? It really helps (optional).</p>
<form id="f">
<textarea id="note" placeholder="Anything else you'd like me to know?" maxlength="1000"></textarea>
<button id="b" type="submit">Send</button>
</form>
</main>
<script>
var q=new URLSearchParams(location.search), email=q.get("e")||"", reason=q.get("r")||"";
if(email&&reason){fetch("https://icatpumzosvfpvuzbvjm.supabase.co/functions/v1/exit-survey",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email,reason:reason})}).catch(function(){});}
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var note=document.getElementById("note").value.trim(), b=document.getElementById("b");
  if(!note||!email){return;}
  b.disabled=true;
  fetch("https://icatpumzosvfpvuzbvjm.supabase.co/functions/v1/exit-survey",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email,note:note})})
  .then(function(r){return r.json()}).then(function(){
    document.getElementById("f").style.display="none";
    document.getElementById("msg").textContent="Thank you, that's all I needed. I'll be in touch about the free year soon.";
  }).catch(function(){b.disabled=false;});
});
</script></body></html>
